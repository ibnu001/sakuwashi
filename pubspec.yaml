name: sakuwashi
description: "Sakuwashi - Aplikasi keuangan pribadi minimalis"
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  google_fonts: ^6.2.1
  csv: ^6.0.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^9.2.1
  google_sign_in: ^6.3.0
  googleapis: ^14.0.0
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
